<div class="container-fluid accounts-page">
    <div class="toolbar d-flex flex-wrap align-items-center justify-content-between gap-2">
        <div class="d-flex align-items-center gap-2">
            <label for="account-group-select" class="mb-0">Account group</label>
            <select id="account-group-select" [(ngModel)]="accountGroupId" name="accountGroupId" class="form-select"
                (change)="onAccountGroupChanged($event)">
                <option [ngValue]="null">Select an account group</option>
                <option *ngFor="let item of viewModel.accountGroups" [ngValue]="item.accountGroupId">
                    {{item.accountGroupName}}</option>
            </select>
        </div>
        <button class="btn btn-secondary" (click)="onSavePositions()" [disabled]="!canSavePositions">
            Save positions
        </button>
    </div>

    <div *ngIf="dragGridItems" class="accounts-tree">
        <app-draggable-grid [columnsNumber]="1" [dataSource]="dragGridItems"
            (positionsChanged)="onPositionsChanged($event)" (itemClicked)="onItemClick($event)">
            <ng-template let-item>
                <div class="card account-card">
                    <div class="card-body">
                        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
                            <div class="d-flex align-items-center gap-2 min-w-0">
                                <span class="drag-handle" cdkDragHandle title="Drag to reorder">⠿</span>
                                <button *ngIf="item.otherGroupSubAccounts.length" type="button"
                                    class="chevron-btn"
                                    [class.expanded]="isExpanded(item.id)"
                                    (click)="toggleExpanded(item.id)"
                                    [attr.aria-label]="isExpanded(item.id) ? 'Collapse' : 'Expand'">▸</button>
                                <span *ngIf="!item.otherGroupSubAccounts.length" class="chevron-spacer"></span>
                                <div class="min-w-0">
                                    <div class="account-name text-truncate">{{item.name}}</div>
                                    <div class="account-meta text-muted">
                                        <ng-container *ngIf="!item.account.parentAccountId">root account<span
                                                *ngIf="item.account.subAccounts?.length"> &middot;
                                                {{item.account.subAccounts.length}} sub-accounts<span
                                                    *ngIf="item.otherGroupSubAccounts.length"> ({{item.otherGroupSubAccounts.length}}
                                                    in other groups)</span></span></ng-container>
                                        <ng-container *ngIf="item.account.parentAccountId">sub-account of
                                            {{item.account.parentAccountName}}</ng-container>
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-2 flex-shrink-0">
                                <span class="badge rounded-pill currency-badge">{{item.account.currencyName}}</span>
                                <button type="button" class="btn btn-outline-secondary btn-sm"
                                    (click)="onEditClick(item.id)">Edit</button>
                                <button *ngIf="!item.account.parentAccountId" type="button"
                                    class="btn btn-outline-secondary btn-sm"
                                    (click)="onAddChildClick(item.account)">+ Add child</button>
                                <button type="button" class="btn btn-outline-danger btn-sm"
                                    (click)="onDeleteClick(item.account)">Delete</button>
                            </div>
                        </div>

                        <div *ngIf="item.otherGroupSubAccounts.length && isExpanded(item.id)" class="children-list">
                            <div *ngFor="let sub of item.otherGroupSubAccounts"
                                class="child-row d-flex flex-wrap align-items-center justify-content-between gap-2">
                                <span class="child-name text-truncate">{{sub.accountName}}</span>
                                <div class="d-flex align-items-center gap-2 flex-shrink-0">
                                    <span class="badge rounded-pill other-group-badge">in
                                        {{getGroupName(sub.accountGroupId)}}</span>
                                    <button type="button" class="btn btn-outline-secondary btn-sm"
                                        (click)="onEditClick(sub.accountId)">Edit</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </ng-template>
        </app-draggable-grid>
    </div>
</div>
