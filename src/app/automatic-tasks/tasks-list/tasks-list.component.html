<div class="task-list">
    <button type="button" class="task-row" *ngFor="let task of tasks"
        [class.is-selected]="task.id === selectedTask?.id" (click)="selectRow(task)">
        <div>
            <p class="task-row-account">{{ task.description }}</p>
            <p class="task-row-desc">{{ task.accountName }}</p>
        </div>
        <app-task-status [taskStatus]="task.lastExecutedStatus"></app-task-status>
    </button>
</div>
