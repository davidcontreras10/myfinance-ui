<div *ngIf="acc?.financeData?.spendViewModels?.length" class="trx-card-list">
  <div class="trx-card-body">

    <div class="trx-list-toolbar" *ngIf="!anySelected()">
        <div class="form-check trx-select-all">
            <input type="checkbox" class="form-check-input" [(ngModel)]="isAllSelected"
                (change)="toggleAllSelection()" id="select-all-{{acc.accountId}}" />
            <label class="form-check-label" for="select-all-{{acc.accountId}}">Select all</label>
        </div>
        <!-- Desktop-only, and only once there's room for two real columns
             (see the wider container-query threshold in the .css) - hidden
             entirely below that, so the feature simply doesn't exist on a
             narrow window or a phone. -->
        <div class="trx-density-toggle" *ngIf="canShowCompactView" role="group" aria-label="List density">
            <button type="button" class="trx-density-btn" [class.active]="viewMode === 'detailed'"
                (click)="setViewMode('detailed')" title="Detailed view" aria-label="Detailed view">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M2 3h12v1.5H2zm0 4.25h12v1.5H2zm0 4.25h12v1.5H2z" />
                </svg>
            </button>
            <button type="button" class="trx-density-btn" [class.active]="viewMode === 'compact'"
                (click)="setViewMode('compact')" title="Compact view" aria-label="Compact view">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                    <path
                        d="M2 2h5.5v5.5H2zm6.5 0H14v5.5H8.5zM2 8.5h5.5V14H2zm6.5 0H14V14H8.5z" />
                </svg>
            </button>
        </div>
    </div>

    <div class="trx-bulk-bar" *ngIf="anySelected()">
        <div class="trx-bulk-left">
            <button type="button" class="trx-bulk-close" (click)="clearSelection()" aria-label="Clear selection"
                [ngbTooltip]="'Clear selection'" placement="top">
                &times;
            </button>
            <span class="trx-bulk-count">{{selectedItemsCount()}} selected</span>
        </div>
        <div class="trx-bulk-actions">
            <button type="button" class="trx-bulk-pill" *ngIf="anyPending()" (click)="onConfirmAllSelected()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                    <path
                        d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.267.267 0 0 1 .02-.022z" />
                </svg>
                Confirm
            </button>
            <button type="button" class="trx-bulk-pill trx-bulk-danger" (click)="onDeleteAllSelected()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                    <path
                        d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6Z" />
                    <path
                        d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1ZM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118ZM2.5 3h11V2h-11v1Z" />
                </svg>
                Delete
            </button>
        </div>
    </div>

    <ng-container *ngIf="viewMode === 'detailed' || !canShowCompactView">
        <div class="trx-card" *ngFor="let trx of getSpendViewModels()" [class.is-pending]="trx.isPending"
            [class.is-selected]="trx.vmIsSelected">
            <span class="debug-data">trxId: {{trx.spendId}}</span>
            <div class="trx-card-top">
                <div class="trx-card-lead">
                    <input type="checkbox" class="form-check-input trx-card-check" [(ngModel)]="trx.vmIsSelected"
                        (change)="toggleSelection(trx)"
                        [attr.aria-label]="'Select transaction from ' + (trx.spendDate | date:'yyyy/MM/dd')" />
                    <span class="trx-card-date">{{ trx.spendDate | date:"yyyy/MM/dd" }}</span>
                </div>
                <app-trx-amount [account]="acc" [spendViewModel]="trx"></app-trx-amount>
            </div>
            <div class="trx-card-mid">
                <span class="trx-card-meta">
                    <span class="trx-type-badge">{{trx.spendTypeName}}</span>
                    <span class="trx-pending-badge" *ngIf="trx.isPending">Pending</span>
                </span>
                <div class="trx-card-actions">
                    <button type="button" class="trx-act-btn" (click)="onTrxEdit(trx)" aria-label="Edit transaction">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                            <path
                                d="m13.498.795.149-.149a1.207 1.207 0 1 1 1.707 1.708l-.149.148a1.5 1.5 0 0 1-.059 2.059L4.854 14.854a.5.5 0 0 1-.233.131l-4 1a.5.5 0 0 1-.606-.606l1-4a.5.5 0 0 1 .131-.232l9.642-9.642a.5.5 0 0 0-.642.056L6.854 4.854a.5.5 0 1 1-.708-.708L9.44.854A1.5 1.5 0 0 1 11.5.796a1.5 1.5 0 0 1 1.998-.001zm-.644.766a.5.5 0 0 0-.707 0L1.95 11.756l-.764 3.057 3.057-.764L14.44 3.854a.5.5 0 0 0 0-.708l-1.585-1.585z" />
                        </svg>
                    </button>
                    <button type="button" class="trx-act-btn" *ngIf="trx.isPending" (click)="onConfirmTransaction(trx)"
                        aria-label="Confirm transaction">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                            <path
                                d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.267.267 0 0 1 .02-.022z" />
                        </svg>
                    </button>
                    <button type="button" class="trx-act-btn trx-act-linked" *ngIf="trx.hasBankTrx"
                        (click)="onBankTrxView(trx)" aria-label="View bank record">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M5.5 9a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 0 1H6a.5.5 0 0 1-.5-.5" />
                            <path
                                d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5z" />
                        </svg>
                    </button>
                    <button type="button" class="trx-act-btn trx-act-danger" (click)="onTrxDelete(trx)"
                        aria-label="Delete transaction">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                            <path
                                d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6Z" />
                            <path
                                d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1ZM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118ZM2.5 3h11V2h-11v1Z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </ng-container>

    <ng-container *ngIf="viewMode === 'compact' && canShowCompactView">
        <div class="trx-compact-body">
            <div class="trx-compact-card" *ngFor="let trx of getSpendViewModels()" [class.is-pending]="trx.isPending"
                [class.is-selected]="trx.vmIsSelected">
                <span class="debug-data">trxId: {{trx.spendId}}</span>
                <input type="checkbox" class="form-check-input trx-compact-check" [(ngModel)]="trx.vmIsSelected"
                    (change)="toggleSelection(trx)"
                    [attr.aria-label]="'Select transaction from ' + (trx.spendDate | date:'yyyy/MM/dd')" />
                <span class="trx-compact-date">{{ trx.spendDate | date:"d MMM" }}</span>
                <span class="trx-compact-type" [attr.title]="trx.spendTypeName">{{trx.spendTypeName}}</span>
                <span class="trx-compact-pending-dot" *ngIf="trx.isPending" title="Pending"
                    aria-label="Pending"></span>
                <app-trx-amount class="trx-compact-amount" [account]="acc" [spendViewModel]="trx"
                    [compact]="true"></app-trx-amount>
                <div ngbDropdown class="trx-compact-menu">
                    <button type="button" class="trx-compact-kebab" [class.linked-bank-trx]="trx.hasBankTrx"
                        ngbDropdownToggle
                        [attr.aria-label]="trx.hasBankTrx ? 'More actions (linked to a bank transaction)' : 'More actions'"
                        [title]="trx.hasBankTrx ? 'Linked to a bank transaction' : null">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                            <path
                                d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0" />
                        </svg>
                    </button>
                    <div ngbDropdownMenu>
                        <button type="button" ngbDropdownItem class="trx-compact-menu-item"
                            (click)="onTrxEdit(trx)">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                                <path
                                    d="m13.498.795.149-.149a1.207 1.207 0 1 1 1.707 1.708l-.149.148a1.5 1.5 0 0 1-.059 2.059L4.854 14.854a.5.5 0 0 1-.233.131l-4 1a.5.5 0 0 1-.606-.606l1-4a.5.5 0 0 1 .131-.232l9.642-9.642a.5.5 0 0 0-.642.056L6.854 4.854a.5.5 0 1 1-.708-.708L9.44.854A1.5 1.5 0 0 1 11.5.796a1.5 1.5 0 0 1 1.998-.001zm-.644.766a.5.5 0 0 0-.707 0L1.95 11.756l-.764 3.057 3.057-.764L14.44 3.854a.5.5 0 0 0 0-.708l-1.585-1.585z" />
                            </svg>
                            Edit
                        </button>
                        <button type="button" ngbDropdownItem class="trx-compact-menu-item" *ngIf="trx.isPending"
                            (click)="onConfirmTransaction(trx)">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                                <path
                                    d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.267.267 0 0 1 .02-.022z" />
                            </svg>
                            Confirm
                        </button>
                        <button type="button" ngbDropdownItem class="trx-compact-menu-item" *ngIf="trx.hasBankTrx"
                            (click)="onBankTrxView(trx)">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                                <path d="M5.5 9a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 0 1H6a.5.5 0 0 1-.5-.5" />
                                <path
                                    d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5z" />
                            </svg>
                            View bank record
                        </button>
                        <button type="button" ngbDropdownItem class="trx-compact-menu-item text-danger"
                            (click)="onTrxDelete(trx)">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                                <path
                                    d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6Z" />
                                <path
                                    d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1ZM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118ZM2.5 3h11V2h-11v1Z" />
                            </svg>
                            Delete
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </ng-container>

  </div>
</div>
<div *ngIf="acc?.financeData?.spendViewModels?.length === 0" class="trx-empty-state">
    No transactions for this period.
</div>
