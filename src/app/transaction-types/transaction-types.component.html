<div class="container-fluid page">
    <div class="page-header">
        <h2 class="page-title">Transaction types</h2>
        <div class="page-tools">
            <div class="input-group search-box">
                <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
                <input type="search" class="form-control" placeholder="Search name or description"
                    aria-label="Search transaction types" [(ngModel)]="filter" />
            </div>
            <button type="button" class="btn btn-primary" (click)="openNewTypeDialog()">
                <i class="bi bi-plus-lg" aria-hidden="true"></i> New type
            </button>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-6">
            <div class="card panel">
                <div class="card-header panel-header">
                    <span class="fw-semibold">My list</span>
                    <span class="badge text-bg-primary">{{userItems().length}}</span>
                </div>
                <app-transaction-types-table [transactionTypes]="userItems()" [myTable]="true" [loading]="loading"
                    class="panel-body" [highlightedId]="highlightedId" [busyIds]="busyIds" [emptyMessage]="filter ? 'No matches in your list.' : 'Nothing here yet. Add types from Available types.'"
                    (textChanged)="onTextChanged($event)" (arrowClicked)="onArrowChanged($event)"
                    (deletedTrx)="onDeleted($event, deleteModal)"></app-transaction-types-table>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card panel">
                <div class="card-header panel-header">
                    <span class="fw-semibold">Available types</span>
                    <span class="badge text-bg-secondary">{{allItems().length}}</span>
                </div>
                <app-transaction-types-table [transactionTypes]="allItems()" [myTable]="false" [loading]="loading"
                    class="panel-body" [highlightedId]="highlightedId" [busyIds]="busyIds" [emptyMessage]="filter ? 'No matches in available types.' : 'Every type is already in your list.'"
                    (textChanged)="onTextChanged($event)" (arrowClicked)="onArrowChanged($event)"
                    (deletedTrx)="onDeleted($event, deleteModal)"></app-transaction-types-table>
            </div>
        </div>
    </div>
</div>

<ng-template #deleteModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Delete transaction type</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
    </div>
    <div class="modal-body">
        Delete <strong>{{deleteTarget?.name}}</strong>? This cannot be undone.
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="modal.dismiss()">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="modal.close()">Delete</button>
    </div>
</ng-template>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <ngb-toast *ngFor="let toast of toasts" [autohide]="true" [delay]="toast.isError ? 5000 : 2500"
        [class]="toast.isError ? 'text-bg-danger' : 'text-bg-dark'" (hidden)="removeToast(toast)">
        {{toast.message}}
    </ngb-toast>
</div>
